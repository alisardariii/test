name: build-apk
on:
  push:
    branches: [android-widget]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish APK to android-apk branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/haftkhan-widget.apk || true
          cd /tmp/out
          git init -q
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout -q -b android-apk
          git add -A
          git commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-apk
