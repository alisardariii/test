plugins { id 'com.android.application' }
android {
    namespace 'ir.haftkhan.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'ir.haftkhan.widget'
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName '2.0'
    }
    signingConfigs {
        debug {
            storeFile file('radres.keystore')
            storePassword 'radres-haftkhan'
            keyAlias 'radres'
            keyPassword 'radres-haftkhan'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
