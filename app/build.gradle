plugins { id 'com.android.application' }
android {
    namespace 'ir.haftkhan.widget'
    compileSdk 34
    defaultConfig {
        applicationId 'ir.haftkhan.widget'
        minSdk 23
        targetSdk 34
        versionCode 28
        versionName '4.2'
    }
    signingConfigs {
        release {
            storeFile file('radres.keystore')
            storePassword 'radres-haftkhan'
            keyAlias 'radres'
            keyPassword 'radres-haftkhan'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
